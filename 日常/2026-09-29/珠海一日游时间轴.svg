<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1240" width="780" height="1240" font-family="PingFang SC, Heiti SC, Microsoft YaHei, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F9FF"/>
      <stop offset="55%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="780" height="1240" fill="url(#bg)"/>

  <!-- header -->
  <text x="30" y="46" font-size="24" font-weight="700" fill="#0F172A">珠海一日游 · 动线时间轴</text>
  <text x="30" y="72" font-size="13" fill="#475569">2026-09-29（周二） · 11:43 抵珠海站 · 22:00 返程 · 日落 18:15 · 全天打车 / 网约车</text>

  <!-- legend chips -->
  <g transform="translate(30,88)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#0EA5E9"/>
    <text x="20" y="12" font-size="12" fill="#334155">景点</text>
    <rect x="70" y="0" width="14" height="14" rx="4" fill="#F97316"/>
    <text x="90" y="12" font-size="12" fill="#334155">餐饮</text>
    <rect x="140" y="0" width="14" height="14" rx="4" fill="#14B8A6"/>
    <text x="160" y="12" font-size="12" fill="#334155">文化打卡</text>
    <rect x="240" y="0" width="14" height="14" rx="4" fill="#A78BFA"/>
    <text x="260" y="12" font-size="12" fill="#334155">咖啡 / 漫步</text>
    <rect x="360" y="0" width="14" height="14" rx="4" fill="#4C1D95"/>
    <text x="380" y="12" font-size="12" fill="#334155">夜景</text>
    <rect x="430" y="0" width="14" height="14" rx="4" fill="#64748B"/>
    <text x="450" y="12" font-size="12" fill="#334155">到 / 离站</text>
  </g>

  <!-- timeline spine -->
  <line x1="130" y1="130" x2="130" y2="1180" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- ============== NODE 1 · Arrival ============== -->
  <g transform="translate(0,150)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">11:43</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">抵站</text>
    <circle cx="130" cy="14" r="10" fill="#64748B" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-6" width="600" height="60" rx="12" fill="#fff" stroke="#E2E8F0"/>
    <text x="176" y="18" font-size="16" font-weight="700" fill="#0F172A">抵达珠海站</text>
    <text x="176" y="42" font-size="12.5" fill="#475569">出站 + 走到网约车上客区约 15 分钟，建议提前叫好车</text>
    <rect x="640" y="4" width="112" height="24" rx="12" fill="#F1F5F9"/>
    <text x="696" y="20" text-anchor="middle" font-size="11" fill="#475569">起点</text>
  </g>

  <!-- transit 1 -->
  <g transform="translate(130,224)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">打车 15 分</text>
  </g>

  <!-- ============== NODE 2 · 猪扒包 ============== -->
  <g transform="translate(0,270)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">12:15</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">午餐 60 分</text>
    <circle cx="130" cy="14" r="10" fill="#F97316" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-16" width="600" height="90" rx="12" fill="#fff" stroke="#FED7AA"/>
    <text x="176" y="14" font-size="16" font-weight="700" fill="#0F172A">澳门友记猪扒包（聚贤园店）</text>
    <text x="176" y="36" font-size="12.5" fill="#475569">招牌猪扒包 + 冻柠茶 / 奶茶，人均 40–60 元</text>
    <text x="176" y="56" font-size="12.5" fill="#475569">分量偏大，两人可共享一份主食 + 一份小食</text>
    <rect x="176" y="66" width="72" height="18" rx="9" fill="#FFEDD5"/>
    <text x="212" y="79" text-anchor="middle" font-size="10.5" fill="#9A3412">简餐</text>
    <rect x="254" y="66" width="72" height="18" rx="9" fill="#FFEDD5"/>
    <text x="290" y="79" text-anchor="middle" font-size="10.5" fill="#9A3412">澳门味</text>
  </g>

  <!-- transit 2 -->
  <g transform="translate(130,394)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">打车 20 分</text>
  </g>

  <!-- ============== NODE 3 · 珠海渔女 ============== -->
  <g transform="translate(0,440)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">13:30</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">游览 90 分</text>
    <circle cx="130" cy="14" r="10" fill="#0EA5E9" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-6" width="600" height="72" rx="12" fill="#fff" stroke="#BAE6FD"/>
    <text x="176" y="18" font-size="16" font-weight="700" fill="#0F172A">珠海渔女 · 香炉湾</text>
    <text x="176" y="42" font-size="12.5" fill="#475569">珠海地标雕塑，香炉湾沙滩边拍照</text>
    <text x="176" y="60" font-size="12.5" fill="#DC2626">⚠ 午后日晒强，带伞 / 防晒</text>
  </g>

  <!-- transit 3 -->
  <g transform="translate(130,548)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">步行 8 分</text>
  </g>

  <!-- ============== NODE 4 · 爱情邮局 ============== -->
  <g transform="translate(0,590)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">15:00</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">停留 45 分</text>
    <circle cx="130" cy="14" r="10" fill="#14B8A6" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-6" width="600" height="72" rx="12" fill="#fff" stroke="#99F6E4"/>
    <text x="176" y="18" font-size="16" font-weight="700" fill="#0F172A">爱情邮局</text>
    <text x="176" y="42" font-size="12.5" fill="#475569">情侣中路 63 号，就在渔女东侧，寄明信片 / 盖纪念章</text>
    <text x="176" y="60" font-size="12.5" fill="#DC2626">⚠ 营业到 18:00，别拖太晚</text>
  </g>

  <!-- transit 4 -->
  <g transform="translate(130,698)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">沿海漫步</text>
  </g>

  <!-- ============== NODE 5 · 咖啡 ============== -->
  <g transform="translate(0,740)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">15:45</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">缓冲 90 分</text>
    <circle cx="130" cy="14" r="10" fill="#A78BFA" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-6" width="600" height="66" rx="12" fill="#fff" stroke="#DDD6FE"/>
    <text x="176" y="18" font-size="16" font-weight="700" fill="#0F172A">情侣路漫步 + 海景咖啡</text>
    <text x="176" y="42" font-size="12.5" fill="#475569">沿路多家海景咖啡店，坐下歇脚 · 弹性时段可压缩至 30 分</text>
  </g>

  <!-- transit 5 -->
  <g transform="translate(130,846)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">打车 20 分</text>
  </g>

  <!-- ============== NODE 6 · 海鲜晚餐 ============== -->
  <g transform="translate(0,890)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#0F172A">17:30</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#64748B">晚餐 120 分</text>
    <circle cx="130" cy="14" r="10" fill="#F97316" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-16" width="600" height="90" rx="12" fill="#fff" stroke="#FED7AA"/>
    <text x="176" y="14" font-size="16" font-weight="700" fill="#0F172A">吉莲利苑海鲜酒家（珠光花园店）</text>
    <text x="176" y="36" font-size="12.5" fill="#475569">拱北 28 年老字号 · 人均 150–250 元</text>
    <text x="176" y="56" font-size="12.5" fill="#475569">推荐：椒盐濑尿虾 / 清蒸海鱼 / 蒜蓉粉丝蒸扇贝 / 虾饺</text>
    <rect x="176" y="66" width="88" height="18" rx="9" fill="#FFEDD5"/>
    <text x="220" y="79" text-anchor="middle" font-size="10.5" fill="#9A3412">⚠ 提前订位</text>
    <rect x="270" y="66" width="80" height="18" rx="9" fill="#FFEDD5"/>
    <text x="310" y="79" text-anchor="middle" font-size="10.5" fill="#9A3412">周末排队</text>
  </g>

  <!-- transit 6 -->
  <g transform="translate(130,1014)">
    <rect x="-48" y="-14" width="96" height="22" rx="11" fill="#E9D5FF" stroke="#C084FC" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">打车 25 分</text>
  </g>

  <!-- ============== NODE 7 · 日月贝夜景 ============== -->
  <g transform="translate(0,1060)">
    <text x="118" y="8" text-anchor="end" font-size="15" font-weight="700" fill="#4C1D95">20:15</text>
    <text x="118" y="24" text-anchor="end" font-size="11" fill="#6D28D9">夜景 90 分</text>
    <circle cx="130" cy="14" r="11" fill="url(#night)" stroke="#fff" stroke-width="3" filter="url(#soft)"/>
    <rect x="158" y="-16" width="600" height="98" rx="12" fill="#1E1B4B" opacity="0.95"/>
    <text x="176" y="14" font-size="16" font-weight="700" fill="#FDE68A">日月贝 · 珠海大剧院（野狸岛）</text>
    <text x="176" y="38" font-size="12.5" fill="#DDD6FE">19:30 后贝壳亮灯，20:00–21:30 是全珠海最出片的时段</text>
    <text x="176" y="58" font-size="12.5" fill="#DDD6FE">绕岛步道一圈约 3–4 km，可远观贝壳也可近拍主入口</text>
    <text x="176" y="78" font-size="12.5" fill="#FBBF24">⚠ 海边风大，带件薄外套</text>
    <!-- tiny shell icon -->
    <g transform="translate(690,20)" opacity="0.85">
      <circle cx="10" cy="10" r="6" fill="#FDE68A"/>
      <circle cx="30" cy="14" r="4" fill="#FCD34D"/>
      <circle cx="46" cy="8" r="2" fill="#FDE68A"/>
    </g>
  </g>

  <!-- transit 7 -->
  <g transform="translate(130,1198)">
    <rect x="-42" y="-14" width="84" height="22" rx="11" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1"/>
    <text x="0" y="3" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">打车 15 分</text>
  </g>

  <!-- ============== NODE 8 · 返程 ============== -->
  <g transform="translate(0,1230)" opacity="0">
    <!-- placeholder to keep spine aligned; not rendered -->
  </g>

  <!-- footer band -->
  <rect x="0" y="1220" width="780" height="20" fill="#0F172A"/>
  <text x="30" y="1234" font-size="11" fill="#94A3B8">全程网约车约 130–150 元 · 建议 5A 风油精+防晒+外套随身 · 情侣路沿线信号良好</text>
  <text x="750" y="1234" text-anchor="end" font-size="11" fill="#94A3B8">22:00 收工</text>

  <!-- final node marker -->
  <circle cx="130" cy="1230" r="6" fill="#64748B" opacity="0"/>
</svg>
